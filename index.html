<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магические Кубики</title>
    
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- HTML2Canvas для скриншотов -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        :root {
            /* Базовые цвета (фоллбек) */
            --bg-color: #ffffff;
            --text-color: #000000;
            --button-color: #3390ec;
            --button-text-color: #ffffff;
            --secondary-bg: #f1f1f1;
            --card-bg: #ffffff;
            --hint-color: #999999;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            /* Цвета будут переопределены JS-ом из темы Telegram */
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            user-select: none; /* Чтобы не выделять текст при тапах */
        }

        h1 {
            font-size: 24px;
            margin: 10px 0 20px;
            text-align: center;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        input[type="number"] {
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--hint-color);
            width: 60px;
            text-align: center;
            font-size: 18px;
            background: var(--secondary-bg);
            color: var(--text-color);
            outline: none;
        }

        /* Область с кубиками, которую будем скринить */
        #captureArea {
            width: 100%;
            padding: 20px;
            background: var(--secondary-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .total-sum {
            font-size: 42px;
            font-weight: 800;
            margin: 10px 0 20px;
            color: var(--button-color);
        }

        .dice-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .die {
            width: 60px;
            height: 60px;
            background: var(--card-bg);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border: 2px solid var(--hint-color);
            color: var(--text-color);
            transition: transform 0.1s;
        }

        /* Анимация тряски */
        .shaking {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            flex: 1;
            max-width: 150px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background-color: var(--button-color);
            color: var(--button-text-color);
        }

        .btn-secondary {
            background-color: var(--secondary-bg);
            color: var(--text-color);
            border: 1px solid var(--hint-color);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .history {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            background: var(--secondary-bg);
            border-radius: 16px;
            margin-top: auto; /* Прижать к низу, если есть место */
        }

        .history h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: var(--hint-color);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }

        .history-values {
            color: var(--hint-color);
            font-size: 12px;
        }
        
        .history-sum {
            font-weight: bold;
            font-size: 16px;
        }

        /* Стили для пустой истории */
        .empty-history {
            text-align: center;
            color: var(--hint-color);
            padding: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>🎲 Кубики Судьбы</h1>

    <div class="controls">
        <label for="diceCount">Количество:</label>
        <input type="number" id="diceCount" value="1" min="1" max="10">
    </div>

    <!-- Область, которая пойдет на скриншот -->
    <div id="captureArea">
        <div class="total-sum" id="totalSum">0</div>
        <div class="dice-area" id="diceArea">
            <!-- Кубики -->
        </div>
    </div>

    <div class="btn-group">
        <button id="rollBtn" class="btn btn-primary">Бросить</button>
        <button id="screenshotBtn" class="btn btn-secondary">📸 Снимок</button>
    </div>
    
    <div class="btn-group">
         <button id="clearBtn" class="btn btn-secondary" style="max-width: 100%;">Очистить историю</button>
    </div>

    <div class="history">
        <h3>История бросков</h3>
        <ul class="history-list" id="historyList">
            <li class="empty-history">Пока пусто</li>
        </ul>
    </div>

    <script>
        // --- Инициализация Telegram WebApp ---
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на весь экран

        // Применение цветов темы Telegram
        function applyTheme() {
            const theme = tg.themeParams;
            const root = document.documentElement;
            
            if (theme.bg_color) root.style.setProperty('--bg-color', theme.bg_color);
            if (theme.text_color) root.style.setProperty('--text-color', theme.text_color);
            if (theme.button_color) root.style.setProperty('--button-color', theme.button_color);
            if (theme.button_text_color) root.style.setProperty('--button-text-color', theme.button_text_color);
            if (theme.secondary_bg_color) root.style.setProperty('--secondary-bg', theme.secondary_bg_color);
            if (theme.hint_color) root.style.setProperty('--hint-color', theme.hint_color);
            
            // Фоллбек для карточек, если secondary_bg нет
            if (!theme.secondary_bg_color && theme.bg_color) {
                // Немного затемняем/осветляем основной фон для контраста
                root.style.setProperty('--secondary-bg', theme.bg_color); 
            }
        }
        applyTheme();

        // Элементы DOM
        const diceArea = document.getElementById('diceArea');
        const totalSumEl = document.getElementById('totalSum');
        const diceCountInput = document.getElementById('diceCount');
        const rollBtn = document.getElementById('rollBtn');
        const screenshotBtn = document.getElementById('screenshotBtn');
        const clearBtn = document.getElementById('clearBtn');
        const historyList = document.getElementById('historyList');
        const captureArea = document.getElementById('captureArea');

        let isRolling = false;

        // --- Логика Кубиков ---

        function createDieElement(value = '?') {
            const die = document.createElement('div');
            die.className = 'die';
            die.textContent = value;
            return die;
        }

        function updateDiceDisplay(count) {
            diceArea.innerHTML = '';
            for (let i = 0; i < count; i++) {
                diceArea.appendChild(createDieElement());
            }
            totalSumEl.textContent = '0';
        }

        function addToHistory(sum, values) {
            // Удаляем заглушку "пусто", если она есть
            const emptyMsg = historyList.querySelector('.empty-history');
            if (emptyMsg) emptyMsg.remove();

            const item = document.createElement('li');
            item.className = 'history-item';
            
            // Формируем строку значений (например: 1, 4, 6)
            const valuesStr = values.join(', ');
            
            item.innerHTML = `
                <span class="history-values">[${valuesStr}]</span>
                <span class="history-sum">${sum}</span>
            `;
            
            historyList.prepend(item);
        }

        function rollDice() {
            if (isRolling) return;
            isRolling = true;

            // Вибрация начала действия
            tg.HapticFeedback.impactOccurred('medium');

            // Блокируем кнопки
            rollBtn.disabled = true;
            screenshotBtn.disabled = true;
            diceCountInput.disabled = true;

            const count = parseInt(diceCountInput.value) || 1;
            
            // Очищаем поле и создаем "трясущиеся" кубики
            diceArea.innerHTML = '';
            const diceElements = [];
            for (let i = 0; i < count; i++) {
                const die = createDieElement('?');
                die.classList.add('shaking');
                diceArea.appendChild(die);
                diceElements.push(die);
            }
            totalSumEl.textContent = '...';

            // Задержка для анимации (600мс)
            setTimeout(() => {
                let sum = 0;
                const values = [];

                diceElements.forEach(die => {
                    const val = Math.floor(Math.random() * 6) + 1;
                    die.textContent = val;
                    die.classList.remove('shaking');
                    sum += val;
                    values.push(val);
                });

                totalSumEl.textContent = sum;
                addToHistory(sum, values);

                // Вибрация успеха
                tg.HapticFeedback.notificationOccurred('success');

                // Разблокировка
                isRolling = false;
                rollBtn.disabled = false;
                screenshotBtn.disabled = false;
                diceCountInput.disabled = false;

            }, 600);
        }

        // --- Логика Скриншота ---

        async function takeScreenshot() {
            if (isRolling) return;
            
            // Вибрация
            tg.HapticFeedback.impactOccurred('light');
            screenshotBtn.disabled = true;
            screenshotBtn.textContent = '⏳ Обработка...';

            try {
                // Ждем немного, чтобы UI обновился
                await new Promise(r => setTimeout(r, 100));

                // Генерируем canvas
                const canvas = await html2canvas(captureArea, {
                    backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--secondary-bg').trim(),
                    scale: 2 // Для лучшего качества
                });

                // Конвертируем в blob/url
                const imageUri = canvas.toDataURL('image/png');

                // Создаем временную ссылку для скачивания
                const link = document.createElement('a');
                link.download = `kubiki-${Date.now()}.png`;
                link.href = imageUri;
                
                // Кликаем программно
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Уведомление об успехе
                tg.showAlert("📸 Снимок сохранен в загрузки устройства!");
                tg.HapticFeedback.notificationOccurred('success');

            } catch (err) {
                console.error(err);
                tg.showAlert("❌ Ошибка создания снимка. Попробуйте снова.");
                tg.HapticFeedback.notificationOccurred('error');
            } finally {
                screenshotBtn.disabled = false;
                screenshotBtn.textContent = '📸 Снимок';
            }
        }

        // --- Обработчики событий ---

        rollBtn.addEventListener('click', rollDice);
        
        // Кнопка Telegram MainButton
        tg.MainButton.setText("БРОСИТЬ КУБИКИ");
        tg.MainButton.show();
        tg.MainButton.onClick(rollDice);

        screenshotBtn.addEventListener('click', takeScreenshot);

        clearBtn.addEventListener('click', () => {
            historyList.innerHTML = '<li class="empty-history">Пока пусто</li>';
            totalSumEl.textContent = '0';
            diceArea.innerHTML = '';
            updateDiceDisplay(parseInt(diceCountInput.value) || 1);
            tg.HapticFeedback.selectionChanged();
        });

        diceCountInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if (val < 1) val = 1;
            if (val > 10) val = 10;
            e.target.value = val;
            updateDiceDisplay(val);
            tg.HapticFeedback.selectionChanged();
        });

        // Старт
        updateDiceDisplay(1);
        tg.ready();

    </script>
</body>
</html>
